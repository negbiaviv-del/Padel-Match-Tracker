# מפעיל עותקים זהים של ממשק המשתמש.
apiVersion: apps/v1
kind: Deployment
metadata:
  # נותן לרכיב הממשק שם אחיד.
  name: {{ include "padel-match-tracker.fullname" . }}-frontend
  labels:
    # מוסיף את התוויות המשותפות של היישום.
    {{- include "padel-match-tracker.labels" . | nindent 4 }}
    # מזהה את המשאב כרכיב ממשק המשתמש.
    app.kubernetes.io/component: frontend

spec:
  # מגדיר כמה פודים של הממשק ירוצו.
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      # בוחר רק פודים של ממשק המשתמש.
      {{- include "padel-match-tracker.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend

  template:
    metadata:
      labels:
        # מסמן את הפוד כרכיב ממשק המשתמש.
        {{- include "padel-match-tracker.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend

    spec:
      containers:
        # מפעיל את מכולת ממשק המשתמש.
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            # חושף את הפורט הפנימי של ממשק המשתמש.
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP

          # בודק שהשרת של ממשק המשתמש פעיל.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # בודק שהממשק מוכן לקבל בקשות.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          # משריין ומגביל משאבים עבור הממשק.
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          volumeMounts:
            # מחבר את הגדרת Nginx שנוצרה על ידי Helm.
            - name: frontend-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        # מספק את קובץ ההגדרות למכולת הממשק.
        - name: frontend-config
          configMap:
            name: {{ include "padel-match-tracker.fullname" . }}-frontend-config
