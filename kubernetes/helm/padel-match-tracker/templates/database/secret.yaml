{{- if .Values.database.password }}
# יוצר מידע סודי עבור סיסמת מסד הנתונים.
apiVersion: v1
kind: Secret
metadata:
  # נותן לסוד שם אחיד לפי ההפצה.
  name: {{ include "padel-match-tracker.fullname" . }}-database
  labels:
    # מוסיף את התוויות המשותפות של היישום.
    {{- include "padel-match-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # שומר את סיסמת מסד הנתונים.
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
