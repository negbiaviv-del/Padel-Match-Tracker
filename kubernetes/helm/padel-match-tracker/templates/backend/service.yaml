# יוצר כתובת פנימית קבועה עבור צד השרת.
apiVersion: v1
kind: Service
metadata:
  # נותן לשירות צד השרת שם אחיד לפי ההפצה.
  name: {{ include "padel-match-tracker.fullname" . }}-backend
  labels:
    # מוסיף את התוויות המשותפות של היישום.
    {{- include "padel-match-tracker.labels" . | nindent 4 }}
    # מזהה את המשאב כרכיב צד השרת.
    app.kubernetes.io/component: backend

spec:
  # מגביל את הגישה לרשת הפנימית של האשכול.
  type: ClusterIP

  ports:
    # מגדיר פורט פנימי עבור בקשות אל ה־API.
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: http

  selector:
    # בוחר רק פודים של צד השרת.
    {{- include "padel-match-tracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
