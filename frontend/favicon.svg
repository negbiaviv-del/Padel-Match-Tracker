<!-- מציג אייקון פאדל ירוק ופשוט ללשונית הדפדפן. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#0b3932"/>

  <!-- מציג מחבט פאדל עגול עם חורים. -->
  <g transform="rotate(-28 29 33)">
    <path
      d="M29 7C18 7 12 16 12 28c0 12 7 20 17 20s17-8 17-20C46 16 40 7 29 7Z"
      fill="#c8ff4d"
      stroke="#f4fff0"
      stroke-width="2"
    />

    <!-- מציג את החורים האופייניים למחבט פאדל. -->
    <g fill="#0b3932">
      <circle cx="22" cy="18" r="2"/>
      <circle cx="29" cy="16" r="2"/>
      <circle cx="36" cy="18" r="2"/>
      <circle cx="19" cy="26" r="2"/>
      <circle cx="26" cy="25" r="2"/>
      <circle cx="33" cy="25" r="2"/>
      <circle cx="40" cy="26" r="2"/>
      <circle cx="22" cy="34" r="2"/>
      <circle cx="29" cy="34" r="2"/>
      <circle cx="36" cy="34" r="2"/>
    </g>

    <!-- מציג ידית קצרה למחבט. -->
    <rect x="25" y="45" width="8" height="13" rx="4" fill="#f4fff0"/>
    <path d="M27 50h4M27 54h4" stroke="#5d9a61" stroke-width="1.2"/>
  </g>

  <!-- מציג כדור פאדל פשוט וברור. -->
  <circle cx="50" cy="46" r="6" fill="#f4fff0"/>
  <circle cx="50" cy="46" r="3.5" fill="#c8ff4d"/>
</svg>
