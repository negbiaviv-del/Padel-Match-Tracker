# מגדיר שרת שמגיש את הממשק ומעביר בקשות נתונים.
server {
    # מאזין לפורט של הממשק.
    listen 8080;

    # מקבל בקשות מכל שם מארח.
    server_name _;

    # מגדיר את תיקיית הקבצים המוגשים.
    root /usr/share/nginx/html;

    # מגדיר את עמוד הכניסה הראשי.
    index index.html;

    # מאפשר לשמור קבצים בעלי שם ייחודי לאורך זמן.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # מונע שמירה של עמוד הכניסה כדי לקבל תמיד את מפת הקבצים החדשה.
    location / {
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # מעביר בקשות נתונים אל השירות הפנימי.
    location /api/ {
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://backend:8000;
    }
}
