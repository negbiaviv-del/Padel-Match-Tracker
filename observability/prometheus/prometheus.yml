# מגדיר את תדירות איסוף המדדים ובדיקת כללי ההתרעה.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# טוען את כללי ההתרעה שנשמרים בפרויקט.
rule_files:
  - "/etc/prometheus/backend-alerts.yml"

# מגדיר מאילו שירותים Prometheus אוסף מדדים.
scrape_configs:
  # אוסף מדדי API משירות צד השרת.
  - job_name: "padel-backend"
    metrics_path: "/metrics/"

    # משתמש בשם שירות Docker הפנימי ובפורט של צד השרת.
    static_configs:
      - targets:
          - "backend:8000"
