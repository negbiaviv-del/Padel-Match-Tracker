# מגדיר את שירותי הפיתוח והניטור המקומיים של הפרויקט.
services:
  # מפעיל את מסד הנתונים ושומר את נתוניו בנפח קבוע.
  postgres:
    image: postgres:16-alpine

    # יוצר את מסד הנתונים ואת המשתמש הדרושים לשירות.
    environment:
      POSTGRES_DB: padel_match_tracker
      POSTGRES_USER: padel_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # מאפשר גישה למסד הנתונים רק מתוך המכונה הווירטואלית.
    ports:
      - "127.0.0.1:5432:5432"

    # שומר את נתוני מסד הנתונים גם אם המכולה נוצרת מחדש.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # בודק שמסד הנתונים מוכן לקבל חיבורים.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # בונה ומפעיל את שירות הנתונים.
  backend:
    build:
      context: ./backend
    image: padel-match-tracker-backend:local

    # מעביר לשירות את פרטי החיבור למסד הנתונים.
    environment:
      POSTGRES_DB: padel_match_tracker
      POSTGRES_USER: padel_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    # מאפשר גישה לשירות רק מתוך המכונה הווירטואלית.
    ports:
      - "127.0.0.1:8000:8000"

    # ממתין שמסד הנתונים יהיה מוכן לפני הפעלת השירות.
    depends_on:
      postgres:
        condition: service_healthy

  # בונה ומפעיל את ממשק המשתמש.
  frontend:
    build:
      context: ./frontend
    image: padel-match-tracker-frontend:local

    # מאפשר לפתוח את הממשק רק מתוך המכונה הווירטואלית.
    ports:
      - "127.0.0.1:8080:8080"

    # מפעיל את הממשק לאחר ששירות הנתונים התחיל.
    depends_on:
      backend:
        condition: service_started

  # אוסף ושומר מדדים מה־backend.
  prometheus:
    image: prom/prometheus:v3.15.0

    # מגביל את שמירת נתוני המדדים המקומיים לשבעה ימים.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    # חושף את ממשק Prometheus רק למכונה המקומית.
    ports:
      - "127.0.0.1:9090:9090"

    # טוען הגדרות, כללי התרעה ושומר נתוני מדדים מקומיים.
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts/backend-alerts.yml:/etc/prometheus/backend-alerts.yml:ro
      - prometheus_data:/prometheus

    # מוודא שה־backend התחיל לפני Prometheus.
    depends_on:
      backend:
        condition: service_started

  # מציג מדדים ודשבורדים דרך Grafana.
  grafana:
    image: grafana/grafana:13.2.4

    # מגדיר משתמש מנהל ומונע פתיחת חשבונות עצמאית.
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    # חושף את ממשק Grafana רק למכונה המקומית.
    ports:
      - "127.0.0.1:3000:3000"

    # שומר הגדרות Grafana וטוען מקור נתונים ודשבורדים מקבצים.
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro

    # מפעיל את Grafana לאחר ש־Prometheus התחיל.
    depends_on:
      prometheus:
        condition: service_started

# מגדיר נפחים קבועים לנתונים שצריכים לשרוד החלפת מכולות.
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
