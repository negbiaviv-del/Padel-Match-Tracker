# מגדיר את שירותי הפיתוח המקומיים של הפרויקט.
services:
  # מפעיל מסד נתונים מקומי ושומר את נתוניו בנפח קבוע.
  postgres:
    image: postgres:16-alpine

    # יוצר את מסד הנתונים והמשתמש לפי הערכים שלהלן.
    environment:
      POSTGRES_DB: padel_match_tracker
      POSTGRES_USER: padel_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # מאפשר גישה למסד הנתונים רק מתוך המכונה הווירטואלית.
    ports:
      - "127.0.0.1:5432:5432"

    # שומר את הנתונים גם כאשר המכולה נוצרת מחדש.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # בודק שמסד הנתונים מוכן לקבל חיבורים.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # בונה ומפעיל את שירות ה־API מתוך התמונה המקומית.
  backend:
    build:
      context: ./backend
    image: padel-match-tracker-backend:local

    # מעביר לשירות את פרטי החיבור למסד הנתונים.
    environment:
      POSTGRES_DB: padel_match_tracker
      POSTGRES_USER: padel_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    # מאפשר גישה לשירות רק מתוך המכונה הווירטואלית.
    ports:
      - "127.0.0.1:8000:8000"

    # ממתין שמסד הנתונים יהיה מוכן לפני הפעלת השירות.
    depends_on:
      postgres:
        condition: service_healthy

# מגדיר אזור אחסון קבוע לנתוני מסד הנתונים.
volumes:
  postgres_data:
